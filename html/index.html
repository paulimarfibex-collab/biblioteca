<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Digital Pro</title>

<style>
    :root {
        --brand-burgundy: #881337;
        --primary: #2563eb;
        --bg-main: #f1f5f9;
        --text-main: #1e293b;
        --border: #e2e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); }

    .navbar { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 15px 5%; background: white; border-bottom: 1px solid var(--border); 
    }
    .logo { 
        display: flex; align-items: center; gap: 15px; 
        font-size: 1.5rem; font-weight: 700; color: var(--brand-burgundy); 
        text-decoration: none; 
    }
    .logo img { 
        height: 60px; width: auto; 
    }
</style>
</head>

<body>
    <nav class="navbar">
        <a href="#" class="logo">
            <img src="fibex logo.jpg" alt="Logo">
            Mi Biblioteca
        </a>
    </nav>
</body>
</html>
