<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Digital</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #f1f5f9; padding: 20px; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    .library { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
    .btn-upload { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
    <h1>Mi Biblioteca</h1>
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">Seleccionar</button>
    <input type="file" id="fileInput" style="display:none">
    <div id="library" class="library">Cargando...</div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPBWM9Nv2yHdFISpIoqLvEt5VG4xWl4OrxYLcltkOzf66_pNPhnj_wFivC8SDZpBxYCg/exec';

    // Función segura para cargar
    async function cargarArchivos() {
        const lib = document.getElementById("library");
        try {
            const response = await fetch(WEB_APP_URL + "?action=listar");
            const data = await response.json();
            
            console.log("Respuesta completa:", data); // Mira esto en la consola F12
            
            lib.innerHTML = "";
            const lista = data.archivos || [];
            
            if (lista.length === 0) lib.innerHTML = "No hay archivos.";
            
            lista.forEach(f => {
                // AQUÍ USAMOS TUS NOMBRES REALES O GENÉRICOS
                const nombre = f.name || f.nombre || "Archivo";
                const url = f.url || f.link || "#";
                
                lib.innerHTML += `
                    <div class="card">
                        <p>${nombre}</p>
                        <a href="${url}" target="_blank">Abrir</a>
                    </div>`;
            });
        } catch (e) {
            lib.innerHTML = "Error al conectar con Drive.";
            console.error(e);
        }
    }

    window.onload = cargarArchivos;
</script>
</body>
</html>
