<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Digital Pro</title>

<style>
    /* Corrección CSS: Asegúrate de usar * para el reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    
    :root {
        --brand-burgundy: #881337;
        --bg-main: #f1f5f9;
    }

    body { background: var(--bg-main); padding: 20px; }
    .dashboard-container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .navbar { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    
    .library { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; background: #fff; }
</style>
</head>
<body>

<div class="dashboard-container">
    <nav class="navbar">
        <img src="fibex logo.jpg" style="height: 50px;">
        <h1>Mi Biblioteca</h1>
    </nav>

    <input type="file" id="fileInput">

    <div id="library" class="library">Cargando archivos...</div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPBWM9Nv2yHdFISpIoqLvEt5VG4xWl4OrxYLcltkOzf66_pNPhnj_wFivC8SDZpBxYCg/exec';

    window.onload = () => {
        fetch(WEB_APP_URL + "?action=listar")
            .then(res => res.json())
            .then(data => {
                // Verificamos si data.archivos existe
                renderLibrary(data.archivos || []);
            })
            .catch(err => {
                document.getElementById("library").innerHTML = "Error al cargar archivos.";
            });
    };

    function renderLibrary(archivos) {
        const lib = document.getElementById("library");
        lib.innerHTML = "";
        
        if (archivos.length === 0) {
            lib.innerHTML = "No hay archivos.";
            return;
        }

        archivos.forEach(f => {
            // Usamos f.nombre y f.url basándonos en lo que debe devolver tu API
            const nombre = f.nombre || "Archivo sin nombre";
            const url = f.url || "#";
            lib.innerHTML += `
                <div class="card">
                    <p>${nombre}</p>
                    <a href="${url}" target="_blank">Abrir</a>
                </div>`;
        });
    }
</script>
</body>
</html>
