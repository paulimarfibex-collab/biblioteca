<script type="module">
    // 1. Importar las herramientas de Firebase (Versión 10)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    // 2. PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (La que copiaste en el Paso 1)
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "TUS_NUMEROS",
        appId: "TU_APP_ID"
    };

    // 3. Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // --- TU LÓGICA DE INTERFAZ SE MANTIENE ---
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const library = document.getElementById("library");
    const search = document.getElementById("search");
    const statsCounter = document.getElementById("statsCounter");
    let files = [];

    // 4. NUEVA LÓGICA DE SUBIDA (Storage + Base de datos)
    async function handleFiles(incomingFiles) {
        // Mostramos un estado de "Subiendo..." al usuario
        dropZone.querySelector('p').textContent = "Subiendo archivo, por favor espera...";
        
        for (let file of incomingFiles) {
            // A) Crear una referencia en el Storage con el nombre del archivo
            const storageRef = ref(storage, 'archivos/' + file.name);
            
            // B) Subir el archivo físico a Firebase Storage
            await uploadBytes(storageRef, file);
            
            // C) Obtener el enlace URL permanente y público de ese archivo
            const urlPermanente = await getDownloadURL(storageRef);
            
            // D) Guardar los datos en Firestore Database
            await addDoc(collection(db, "documentos"), {
                name: file.name,
                size: (file.size / 1024).toFixed(2) + " KB",
                type: file.type,
                url: urlPermanente, // Guardamos la URL de la nube, no la local
                fecha: Date.now()
            });
        }
        
        dropZone.querySelector('p').textContent = "Arrastra tus documentos académicos aquí...";
    }

    // 5. ESCUCHAR LA BASE DE DATOS EN TIEMPO REAL
    // Reemplazamos el arreglo local por una conexión directa a Firestore
    onSnapshot(collection(db, "documentos"), (snapshot) => {
        files = [];
        snapshot.forEach((doc) => {
            files.push({ id: doc.id, ...doc.data() }); // Guardamos el ID real de la base de datos
        });
        renderLibrary(); // Redibujamos la pantalla cada vez que hay un cambio en la nube
    });

    // Eventos de arrastrar y soltar (se mantienen igual que los tuyos)
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener("change", function() { handleFiles(this.files); this.value = ""; });
    search.addEventListener("input", renderLibrary);

    // 6. ACTUALIZAR FUNCIÓN DE BORRADO
    window.deleteFile = async function(id) {
        // Encontrar el archivo en nuestra lista
        const item = files.find(f => f.id === id);
        if (!item) return;

        // A) Borrar el archivo físico del Storage
        const fileRef = ref(storage, 'archivos/' + item.name);
        try {
            await deleteObject(fileRef);
        } catch(e) { console.log("El archivo físico ya no existía"); }

        // B) Borrar el registro de la Base de Datos
        await deleteDoc(doc(db, "documentos", id));
    };

    // (Aquí debes pegar tus funciones getFileMeta, renderLibrary, viewFile, downloadFile y closeViewer que ya tenías. 
    // Solo asegúrate de agregar "window." antes de las funciones que usas en el HTML con onclick, por ejemplo: window.viewFile = function(id) {...} ya que al usar type="module" las funciones no son globales automáticamente).

</script>
