<div class="library-section">
        <div class="library-header"><span>Archivos en tu Base de Datos de Drive</span></div>
        <div id="library" class="library">
            <div class="empty">Cargando datos desde la API de Drive...</div>
        </div>
    </div>
</div>

<script>
// ==========================================
// CONFIGURACIÓN: ACCESO Y API
// ==========================================
const USER_VALIDO = 'admin';  
const PASS_VALIDO = '1234';   

const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPBWM9Nv2yHdFISpIoqLvEt5VG4xWl4OrxYLcltkOzf66_pNPhnj_wFivC8SDZpBxYCg/exec';

let files = [];

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const library = document.getElementById("library");
const search = document.getElementById("search");
const statsCounter = document.getElementById("statsCounter");
const uploadText = document.getElementById("uploadText");

// Función de validación de Login
function validarLogin(e) {
    e.preventDefault();
    const userIngresado = document.getElementById("user").value;
    const passIngresado = document.getElementById("pass").value;
    const errorMsg = document.getElementById("loginError");

    if (userIngresado === USER_VALIDO && passIngresado === PASS_VALIDO) {
        document.getElementById("loginScreen").style.display = 'none';
        document.getElementById("userNameDisplay").textContent = userIngresado;
        cargarBaseDatos();
    } else {
        errorMsg.style.display = 'block';
        document.getElementById("pass").value = '';
    }
}

// Carga de datos desde Drive
function cargarBaseDatos() {
    llamarAPI({ action: 'listar' }, function(respuesta) {
        if (respuesta && respuesta.exito) {
            files = respuesta.archivos;
            renderLibrary();
        } else {
            statsCounter.textContent = "Error";
            library.innerHTML = `<div class="empty">No se pudo autenticar o conectar con Drive.</div>`;
        }
    });
}

// Función centralizada para llamar al Servidor de Apps Script
function llamarAPI(datos, callback) {
    fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'cors',
        body: JSON.stringify(datos)
    })
    .then(res => res.json())
    .then(json => callback(json))
    .catch(err => {
        console.error("Error en API:", err);
        alert("Error de conexión con el servidor de Google Drive.");
    });
}

// Drag & Drop
['dragenter', 'dragover'].forEach(eName => { dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }); });
['dragleave', 'drop'].forEach(eName => { dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }); });
dropZone.addEventListener('drop', (e) => { handleFiles(e.dataTransfer.files); });
fileInput.addEventListener("change", function() { handleFiles(this.files); this.value = ""; });
search.addEventListener("input", renderLibrary);

function handleFiles(incomingFiles) {
    [...incomingFiles].forEach(file => {
        uploadText.innerText = "Subiendo...";
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result;
            
            llamarAPI({
                action: 'subir',
                base64Data: base64Data,
                nombre: file.name,
                tipoMime: file.type
            }, function(respuesta) {
                uploadText.innerText = "Subir Archivos";
                if(respuesta && respuesta.exito) {
                    files.unshift(respuesta.archivo);
                    renderLibrary();
                } else {
                    alert("Error de subida: " + (respuesta.error || "Desconocido"));
                }
            });
        };
        reader.readAsDataURL(file);
    });
}

function getFileMeta(filename, type) {
    const ext = filename.split('.').pop().toLowerCase();
    if (type.includes("pdf") || ext === 'pdf') return { icon: "📕", label: "PDF Académico" };
    if (type.startsWith("image/")) return { icon: "🖼️", label: "Imagen" };
    if (['doc','docx'].includes(ext)) return { icon: "📘", label: "Word" };
    if (['xls','xlsx'].includes(ext)) return { icon: "🍏", label: "Excel" };
    return { icon: "📁", label: "Documento" };
}

function deleteFile(id) {
    if(!confirm("¿Seguro que deseas enviar este archivo a la papelera de Drive?")) return;
    
    const backupFiles = [...files];
    files = files.filter(f => f.id !== id);
    renderLibrary();

    llamarAPI({ action: 'eliminar', id: id }, function(respuesta) {
        if(!respuesta || !respuesta.exito) {
            alert("Error al eliminar en la nube.");
            files = backupFiles;
            renderLibrary();
        }
    });
}

function renderLibrary() {
    const term = search.value.toLowerCase();
    const filtered = files.filter(f => f.name.toLowerCase().includes(term));

    statsCounter.textContent = `Total: ${filtered.length}`;

    if (filtered.length === 0) {
        library.innerHTML = `<div class="empty">No hay documentos en la base de datos de Drive.</div>`;
        return;
    }

    library.innerHTML = "";
    const fragment = document.createDocumentFragment();

    filtered.forEach(item => {
        const meta = getFileMeta(item.name, item.type);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="card-header">
                <span class="file-icon">${meta.icon}</span>
                <span class="file-name" title="${item.name}">${item.name}</span>
            </div>
            <div class="card-body">
                <div class="file-info">
                    <span>${meta.label}</span>
                    <span>${item.size}</span>
                </div>
                <div class="buttons">
                    <button class="btn view-btn" onclick="window.open('${item.url}', '_blank')">Abrir en Drive ↗</button>
                    <button class="btn delete-btn" onclick="deleteFile('${item.id}')">🗑️</button>
                </div>
            </div>
        `;
        fragment.appendChild(card);
    });
    library.appendChild(fragment);
}
</script>

</html>
